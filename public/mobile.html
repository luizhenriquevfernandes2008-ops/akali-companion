<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#07060d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Akali" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Akali Remote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="mobile.css" />
</head>
<body>
  <div id="bg"><div id="bgImg"></div></div>

  <header class="top">
    <div class="status"><span id="dot" class="dot"></span><span id="statusText">Conectando ao PC…</span></div>
    <button class="icon-btn" data-act="sheet" aria-label="Configurações">⚙</button>
  </header>

  <main id="screen"></main>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card">
      <h3>Configurações</h3>
      <label class="switch"><input type="checkbox" id="optAccept" /><span>Aceitar partidas automaticamente</span></label>
      <label class="switch"><input type="checkbox" id="optRunes" /><span>Importar runas do OP.GG ao confirmar o campeão</span></label>
      <button class="btn wide" data-act="sound">🔔 Ativar som e vibração de alerta</button>
      <a class="btn wide ghost" href="/">Abrir o app completo (builds, estatísticas…)</a>
      <button class="btn wide ghost" data-act="sheet">Fechar</button>
    </div>
  </div>

  <div id="toast"></div>
  <script type="module" src="mobile.js"></script>
</body>
</html>
